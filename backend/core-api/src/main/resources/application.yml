# Configuração completa, usada no Docker Compose (sem perfil).
# Para rodar na máquina, application-local.yml sobrescreve o que for diferente.
spring:
  application:
    name: ativos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ativos}
    username: ${DB_USERNAME:ativos}
    password: ${DB_PASSWORD:ativos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: always
  jackson:
    generator:
      # Sem isso, uma quantidade como 0.00000001 sai no JSON como 1E-8.
      write-bigdecimal-as-plain: true

server:
  port: ${SERVER_PORT:8080}
  # Com framework, confia em X-Forwarded-*: só use atrás de um proxy, que é quem define esses cabeçalhos.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        # O padrão do Spring Session é SESSION; a documentação define JSESSIONID.
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  # Conta promovida a administrador ao iniciar, se existir.
  admin-email: ${APP_ADMIN_EMAIL:}
  # Valor inicial: o admin pode mudar pela tela de configurações.
  registration-enabled: true
  cors:
    # Lista separada por vírgulas. O padrão é o ng serve do Angular.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

market:
  # Valores iniciais: o admin pode mudar pela tela de configurações.
  collection-enabled: true
  manual-refresh-seconds: 60
  # Para trocar de provedor, basta alterar estas propriedades. Vazio desliga a coleta do grupo.
  provider:
    crypto: ${MARKET_PROVIDER_CRYPTO:binance}
    stock: ${MARKET_PROVIDER_STOCK:brapi}
  # Hora cheia. Só esta coleta gera snapshots patrimoniais.
  collection-cron: ${MARKET_COLLECTION_CRON:0 0 * * * *}
  collect-on-startup: ${MARKET_COLLECT_ON_STARTUP:true}
  binance:
    base-url: https://api.binance.com
    quote-asset: BRL
  brapi:
    base-url: https://brapi.dev
    # Sem token, a Brapi só responde para alguns ativos de teste (PETR4, VALE3, ITUB4 e MGLU3).
    token: ${BRAPI_TOKEN:}

# Com enabled=false, /api/predictions deixa de existir e o restante do sistema não muda.
predictive:
  enabled: ${PREDICTIVE_ENABLED:true}
  # Os valores abaixo são iniciais: o admin pode mudar quase todos pela tela de configurações.
  # Um ativo com menos dias de cotações não é medido e usa as premissas de referência.
  # Abaixo de 90 porque a carga de 3 meses da Brapi pode ficar perto desse limite.
  min-history-days: 60
  # Limites do retorno anual medido: pouco histórico anualizado gera valores absurdos.
  min-observed-return: -0.5
  max-observed-return: 1.0
  # z de uma distribuição normal para o intervalo de confiança de 80%.
  confidence-level: 0.80
  confidence-z: 1.2816
  # Premissas anuais de referência, não são dados de mercado: ajuste conforme sua análise.
  reference:
    stock-return: 0.10
    stock-volatility: 0.25
    crypto-return: 0.20
    crypto-volatility: 0.70
  scenarios:
    optimistic-return-bonus: 0.05
    pessimistic-return-penalty: 0.05
    # Queda imediata na classe de maior risco presente na carteira, só no cenário pessimista.
    crypto-stress: 0.40
    stock-stress: 0.20
  risk:
    max-crypto-share: 0.70
    max-asset-share: 0.50

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    # A página lê o cookie XSRF-TOKEN e envia o header X-XSRF-TOKEN em cada chamada.
    csrf:
      enabled: true
  paths-to-match: /api/**
  default-produces-media-type: application/json
  # Sem isso, as respostas do @RestControllerAdvice entram em todos os endpoints da documentação.
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
