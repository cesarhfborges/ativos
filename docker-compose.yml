services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Credenciais apenas de desenvolvimento, iguais às do application.yml.
      POSTGRES_DB: ativos
      POSTGRES_USER: ativos
      POSTGRES_PASSWORD: ativos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ativos

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/ativos
      DB_USERNAME: ativos
      DB_PASSWORD: ativos
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ativos

networks:
  ativos:
    driver: bridge

volumes:
  postgres-data:
