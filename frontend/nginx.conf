# Atrás do proxy do Coolify, esta conexão é HTTP: o protocolo original é o que o proxy informou.
map $http_x_forwarded_proto $original_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com o endereço numa variável, o nginx resolve o nome a cada requisição;
    # sem isso, guardaria o IP de quando subiu e daria 502 depois de um restart só do backend.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8080;

    # A API fica na mesma origem da SPA, então o cookie de sessão e o token CSRF funcionam sem CORS.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_proto;
    }

    # Rotas do Angular: qualquer caminho que não seja arquivo devolve a SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
