# Atrás do proxy do Coolify, esta conexão é HTTP: o protocolo original é o que o proxy informou.
map $http_x_forwarded_proto $original_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_tokens off;

    # DNS interno do Docker. Com os endereços em variáveis, o nginx resolve os nomes a cada requisição;
    # sem isso, guardaria os IPs de quando subiu e daria 502 depois de um restart só do backend ou do frontend.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8080;
    set $frontend_upstream http://frontend:80;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $original_proto;

    # Só /api/ chega ao backend: /actuator e o Swagger ficam inacessíveis por fora.
    # A API fica na mesma origem da SPA, então o cookie de sessão e o token CSRF funcionam sem CORS.
    location /api/ {
        proxy_pass $backend_upstream;
    }

    location / {
        proxy_pass $frontend_upstream;
    }

    # Saúde do próprio gateway, sem depender dos outros containers.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
